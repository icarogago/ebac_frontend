<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="./styles/main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" id="profile-avatar" src="https://via.placeholder.com/180x180" alt=".">
            <h1 class="profile-name" id="profile-name">Icaro Gago</h1>
            <h2 class="profile-username" id="profile-username">@icarogago</h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="profile-repos">5</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="profile-followers">5</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="profile-following">5</span>
                </li>
            </ul>
            <a href="#" class="profile-link" id="profile-link">Ver no Github</a>
        </div>
    </header>

    <script src="./scripts/script.js"></script>
</body>
</html>
